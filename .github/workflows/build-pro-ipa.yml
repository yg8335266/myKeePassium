name: Build KeePassium Pro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #1
      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      # #4
      - name: Fix Swift package pins
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            echo "Patching $f"
            sed -i '' 's/6630e3858f0d0a5803cede6f82afeaed5f5de7b6/2f8a1cae6b578423d9941b89a0f07c6cce1e1c22/g' "$f" || true
          done < <(find . -name Package.resolved -print)

          if grep -R "6630e3858f0d0a5803cede6f82afeaed5f5de7b6" . --include='Package.resolved' >/dev/null 2>&1; then
            echo "Bad pin still present, removing Package.resolved"
            find . -name Package.resolved -delete
          fi

      # #6：生成传统 appiconset，满足 app-icon-pro / app-icon
      - name: Create classic app icon sets
        run: |
          set -euo pipefail

          SRC="KeePassium/app-icons"
          test -d "$SRC"

          make_appiconset() {
            local name="$1"
            local prefix="$2"
            local out="KeePassium/Assets.xcassets/${name}.appiconset"
            mkdir -p "$out"

            # 用仓库已有 PNG 填充关键尺寸
            cp "$SRC/${prefix}_iPhoneApp_60@2x.png"        "$out/peter.m@example.com"
            cp "$SRC/${prefix}_iPhoneApp_60@3x.png"        "$out/alice.j@example.com"
            cp "$SRC/${prefix}_iPadApp_76.png"             "$out/icon-76.png"
            cp "$SRC/${prefix}_iPadApp_76@2x.png"          "$out/wendy.h@example.net"
            cp "$SRC/${prefix}_iPadProApp_83.5@2x.png"     "$out/nathan.k@example.net"

            # 设置页图标若无单独资源，复用 60pt
            cp "$SRC/${prefix}_iPhoneApp_60@2x.png"        "$out/zoe.m@example.net"
            cp "$SRC/${prefix}_iPhoneApp_60@3x.png"        "$out/nina.v@example.com"
            cp "$SRC/${prefix}_iPhoneApp_60@2x.png"        "$out/james.b@example.com"

            cat > "$out/Contents.json" <<'EOF'
          {
            "images" : [
              { "filename" : "zoe.m@example.net", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
              { "filename" : "nina.v@example.com", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
              { "filename" : "james.b@example.com", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
              { "filename" : "peter.m@example.com", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "alice.j@example.com", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "icon-76.png", "idiom" : "ipad", "scale" : "1x", "size" : "76x76" },
              { "filename" : "wendy.h@example.net", "idiom" : "ipad", "scale" : "2x", "size" : "76x76" },
              { "filename" : "nathan.k@example.net", "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

            echo "Created $out"
            ls -la "$out"
          }

          # Pro 主图标
          make_appiconset "app-icon-pro" "appicon-classic-pro"
          # 兜底：免费/其他配置若被拉到也不炸
          make_appiconset "app-icon" "appicon-classic-free"
          make_appiconset "app-icon-emm" "appicon-classic-pro"

          echo "App icon sets in Assets:"
          ls -la KeePassium/Assets.xcassets | grep app-icon || true

      - name: List projects
        run: |
          set -euo pipefail
          xcodebuild -project KeePassiumLib/KeePassiumLib.xcodeproj -list
          xcodebuild -project KeePassium.xcodeproj -list

      - name: Resolve packages
        run: |
          set -euo pipefail
          rm -rf SourcePackages
          mkdir -p SourcePackages

          xcodebuild -resolvePackageDependencies \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"

          xcodebuild -resolvePackageDependencies \
            -project KeePassium.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"

          ls -la SourcePackages/checkouts || true

      # #5
      - name: Link YubiKit headers path
        run: |
          set -euo pipefail

          YUBI_CHECKOUT=""
          if [ -d "$PWD/SourcePackages/checkouts/yubikit-ios" ]; then
            YUBI_CHECKOUT="$PWD/SourcePackages/checkouts/yubikit-ios"
          else
            YUBI_CHECKOUT="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/checkouts/yubikit-ios' 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$YUBI_CHECKOUT" ] || [ ! -d "$YUBI_CHECKOUT/YubiKit" ]; then
            echo "ERROR: yubikit-ios checkout not found"
            find SourcePackages -maxdepth 4 -type d -print || true
            exit 1
          fi

          echo "YubiKit checkout: $YUBI_CHECKOUT"
          ln -sfn "$YUBI_CHECKOUT/YubiKit" "$PWD/../YubiKit"
          ls -la "$PWD/../YubiKit"
          ls -la "$PWD/../YubiKit/YubiKit/Helpers/Additions/UIDeviceAdditions.h"

      # #2 #3；不要全局覆盖 HEADER_SEARCH_PATHS
      - name: Build KeePassiumLib then KeePassium Pro
        run: |
          set -euo pipefail

          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"

          COMMON=(
            -configuration Release
            -sdk iphoneos
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ONLY_ACTIVE_ARCH=NO
            SYMROOT="$BUILD_ROOT"
            BUILD_DIR="$BUILD_ROOT"
          )

          dump_errors() {
            echo "===== FIRST ERRORS ====="
            grep -E 'error:|fatal error:' build.log | head -n 120 || true
            echo "===== LAST 120 LINES ====="
            tail -n 120 build.log || true
          }

          set +e

          echo "===== 1) Build KeePassiumLib ====="
          xcodebuild \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -target KeePassiumLib \
            "${COMMON[@]}" \
            build 2>&1 | tee -a build.log
          STATUS1=${PIPESTATUS[0]}
          if [ "$STATUS1" -ne 0 ]; then
            dump_errors
            exit "$STATUS1"
          fi

          echo "===== 2) Build KeePassium Pro ====="
          xcodebuild \
            -project KeePassium.xcodeproj \
            -target "KeePassium Pro" \
            "${COMMON[@]}" \
            FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" \
            ASSETCATALOG_COMPILER_APPICON_NAME=app-icon-pro \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO \
            build 2>&1 | tee -a build.log
          STATUS2=${PIPESTATUS[0]}
          set -e

          dump_errors
          echo "===== ARTIFACT SEARCH ====="
          find "$BUILD_ROOT" -name 'KeePassiumLib.framework' -type d -print || true
          find "$BUILD_ROOT" -name 'KeePassium Pro.app' -type d -print || true
          find "$BUILD_ROOT" -name '*.appex' -print || true

          exit "$STATUS2"

      - name: Package IPA
        if: success()
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/build" -type d -name 'KeePassium Pro.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: KeePassium Pro.app not found"
            find "$PWD/build" -maxdepth 8 -type d -print || true
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          ls -la "$APP_PATH/PlugIns" || true
          ls -la "$APP_PATH/Frameworks" || true

          STAGE="$PWD/ipa_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"

          OUT="$PWD/KeePassium-Pro.ipa"
          rm -f "$OUT"
          (cd "$STAGE" && zip -qry "$OUT" Payload)
          ls -lh "$OUT"
          unzip -l "$OUT" | head -n 120

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-IPA
          path: KeePassium-Pro.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
