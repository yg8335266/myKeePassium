name: Build KeePassium Pro for iOS 16

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - '1.53.154-pro'

jobs:
  build:
    name: Build IPA (iOS 15.4+)
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ==================== CODE PATCH ====================
      - name: Patch - Disable Pro check (return true)
        run: |
          echo "=== Patching PremiumManager.isAvailable ==="
          sed -i.bak 's/return feature.isAvailable(in: status, fallbackDate: fallbackDate)/return true/' \
            KeePassiumLib/KeePassiumLib/premium/PremiumManager.swift
          echo "Verifying:"
          grep -n "return true" KeePassiumLib/KeePassiumLib/premium/PremiumManager.swift
          grep -n "return" KeePassiumLib/KeePassiumLib/premium/PremiumManager.swift | head -5

      # ==================== BUNDLE ID ====================
      - name: Change Bundle ID
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "Owner: $OWNER"
          sed -i '' \
            -e "s/com\.keepassium\.ios;/com.${OWNER}.keepassium;/g" \
            -e "s/com\.keepassium\.ios\.KeePassium-AutoFill/com.${OWNER}.keepassium.AutoFill/g" \
            KeePassium.xcodeproj/project.pbxproj
          echo "New Bundle IDs:"
          grep -Eo 'PRODUCT_BUNDLE_IDENTIFIER = "[^"]*"' KeePassium.xcodeproj/project.pbxproj | sort -u

      # ==================== XCODE SETUP ====================
      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild -workspace KeePassium.xcworkspace -list 2>&1 || true

      # ==================== RESOLVE DEPENDENCIES ====================
      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace KeePassium.xcworkspace \
            -scheme KeePassium 2>&1

      # ==================== BUILD ====================
      - name: Archive build
        run: |
          xcodebuild archive \
            -workspace KeePassium.xcworkspace \
            -scheme KeePassium \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ./build/KeePassium.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1

      # ==================== IPA ====================
      - name: Create IPA
        run: |
          mkdir -p ./build/Payload
          cp -R ./build/KeePassium.xcarchive/Products/Applications/KeePassium.app ./build/Payload/
          cd ./build
          zip -r KeePassium-Pro-iOS16.ipa Payload
          cd ..
          ls -lh ./KeePassium-Pro-iOS16.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-iOS16
          path: ./KeePassium-Pro-iOS16.ipa
          retention-days: 7

      - name: Summary
        run: |
          echo "============================================================"
          echo "BUILD SUCCESS"
          echo "Install with TrollStore"
          echo "============================================================"
