name: Build KeePassium Pro 153

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: keepassium/KeePassium
          ref: 1.53.154
          fetch-depth: 0

      - name: Verify version
        run: git describe --tags --exact-match HEAD

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Create license placeholder
        run: |
          mkdir -p KeePassiumLib/KeePassiumLib/resources/licensing
          python3 -c "open('KeePassiumLib/KeePassiumLib/resources/licensing/v1-proofs.sha256','wb').close()"
          ls -la KeePassiumLib/KeePassiumLib/resources/licensing

      - name: Resolve packages
        run: |
          mkdir -p SourcePackages
          xcodebuild -resolvePackageDependencies -project KeePassiumLib/KeePassiumLib.xcodeproj -clonedSourcePackagesDirPath "$PWD/SourcePackages"
          xcodebuild -resolvePackageDependencies -project KeePassium.xcodeproj -clonedSourcePackagesDirPath "$PWD/SourcePackages"

      - name: Link YubiKit if present
        run: |
          if [ -d SourcePackages/checkouts/yubikit-ios/YubiKit ]; then
            ln -sfn "$PWD/SourcePackages/checkouts/yubikit-ios/Y
            echo "YubiKit not found, skip"
          fi

      - name: Build
        run: |
          set -e
          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"

          xcodebuild \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -target KeePassiumLib \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$BUILD_ROOT" \
            BUILD_DIR="$BUILD_ROOT" \
            build 2>&1 | tee build.log

          xcodebuild \
            -project KeePassium.xcodeproj \
            -target "KeePassium Pro" \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$BUILD_ROOT" \
            BUILD_DIR="$BUILD_ROOT" \
            FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" \
            ASSETCATALOG_COMPILER_APPICON_NAME=app-icon-pro \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO \
            build 2>&1 | tee -a build.log

      - name: Sign and package IPA
        run: |
          set -e
          APP_PATH="$(find "$PWD/build" -type d -name 'KeePassium Pro.app' | head -n 1)"
          test -n "$APP_PATH"
          echo "App=$APP_PATH"

          cat > app.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.>application-identifier</key>
            <string>com.keepassium.ios.pro</string>
            <key>com.apple.developer.team-identifier</key>
            <string>TROLL</string>
            <key>com.apple.developer.authentication-services.autofill-credential-provider</key>
            <true/>
            <key>com.apple.developer.default-data-protection</key>
            <string>NSFileProtectionComplete</string>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.keepassium</string>
            </array>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
              <string>com.keepassium.SharedItems</string>
            </array>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
          </dict>
          </plist>
          EOF

          cat > appex.entitlements << 'EOF'
          <?xml
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.keepassium.ios.pro.KeePassium-AutoFill</string>
            <key>com.apple.developer.team-identifier</key>
            <string>TROLL</string>
            <key>com.apple.developer.authentication-services.autofill-credential-provider</key>
            <true/>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.keepassium</string>
            </array>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
              <string>com.keepassium.SharedItems</string>
            </array>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
          </dict>
          </plist>
          EOF

          # strip accidental leading spaces from heredoc files
          sed -i '' 's/^  "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -name '*.framework' -maxdepth 1 | while read fw; do
              codesign --force --sign - --entitlements app.entitlements --timestamp=none "$fw"
            done
          fi

          if [ -d "$APP_PATH/PlugIns" ]; then
            find "$APP_PATH/PlugIns" -name '*.appex' -maxdepth 1 | while read appex; do
              codesign --force --sign - --entitlements appex.entitlements --timestamp=none "$appex"
            done
          fi

          codesign --force --sign - --entitlements app.entitlements --timestamp=none "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" | head -n 50 || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info/_CodeSignature" || true

          rm -rf ipa_stage
          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/
          rm -f KeePassium-Pro-1.53.154.ipa
          (cd ipa_stage && zip -qry ../KeePassium-Pro-1.53.154.ipa Payload)
          ls -lh KeePassium-Pro-1.53.154.ipa
          unzip -l KeePassium-Pro-1.53.154.ipa | head -n 80

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-1.53.154-IPA
          path: KeePassium-Pro-1.53.154.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-
          path: build.log
          if-no-files-found: warn
