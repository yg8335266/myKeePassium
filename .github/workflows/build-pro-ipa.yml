name: Build KeePassium Pro 153

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: keepassium/KeePassium
          ref: 1.53.154
          fetch-depth: 0

      - name: Verify version
        run: |
          set -e
          TAG="$(git describe --tags --exact-match HEAD)"
          echo "TAG=$TAG"
          test "$TAG" = "1.53.154"
          # Fail early if someone swapped checkout to master/2.x
          grep -R "IPHONEOS_DEPLOYMENT_TARGET = 15.4" KeePassium.xcodeproj/project.pbxproj >/dev/null
          ! grep -R "IPHONEOS_DEPLOYMENT_TARGET = 17.0" KeePassium.xcodeproj/project.pbxproj >/dev/null
          ! grep -R "MARKETING_VERSION = 2.6" KeePassium.xcodeproj/project.pbxproj >/dev/null
          echo "Source is 1.53.154 / iOS 15.4 OK"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app && xcodebuild -version

      - name: Create license placeholder
        run: mkdir -p KeePassiumLib/KeePassiumLib/resources/licensing && python3 -c "open('KeePassiumLib/KeePassiumLib/resources/licensing/v1-proofs.sha256','wb').close()"

      - name: Fix TPInAppReceipt pin
        run: |
          OLD=6630e3858f0d0a5803cede6f82afeaed5f5de7b6
          NEW=2f8a1cae6b578423d9941b89a0f07c6cce1e1c22
          find . -name Package.resolved -exec sed -i '' "s/$OLD/$NEW/g" {} +
          if grep -R "$OLD" . --include='Package.resolved' >/dev/null 2>&1; then find . -name Package.resolved -delete; fi
          find . -name Package.resolved -print || true

      - name: Patch for TrollStore persistence
        run: |
          echo '' | base64 -D > /tmp/patch_kp.py
          python3 /tmp/patch_kp.py
          grep -n "unexpected format, removing\|TROLL.com.keepassium.SharedItems\|creating without wiping keychain" KeePassiumLib/KeePassiumLib/util/Keychain.swift
          grep -n "containerURL\|suiteName: AppGroup.id" KeePassiumLib/KeePassiumLib/util/UserDefaults+appGroupShared.swift
          grep -n "BusinessModel = .prepaid\|return PurchaseHistory.prepaidProVersion\|premiumIsQuickTypeEnabled\|stored ?? true" KeePassiumLib/KeePassiumLib/premium/*.swift KeePassiumLib/KeePassiumLib/util/Settings.swift
          ! grep -q "falling back to standard" KeePassiumLib/KeePassiumLib/util/UserDefaults+appGroupShared.swift

      - name: Resolve packages
        run: |
          mkdir -p SourcePackages
          xcodebuild -resolvePackageDependencies -project KeePassiumLib/KeePassiumLib.xcodeproj -clonedSourcePackagesDirPath "$PWD/SourcePackages"
          xcodebuild -resolvePackageDependencies -project KeePassium.xcodeproj -clonedSourcePackagesDirPath "$PWD/SourcePackages"

      - name: Link YubiKit if present
        run: |
          if [ -d SourcePackages/checkouts/yubikit-ios/YubiKit ]; then ln -sfn "$PWD/SourcePackages/checkouts/yubikit-ios/YubiKit" "$PWD/../YubiKit"; fi

      - name: Build
        run: |
          set -e
          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"
          # Force iOS 15.4 so the IPA cannot silently become master/2.6 (iOS 17)
          COMMON=(
            -configuration Release
            -sdk iphoneos
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ONLY_ACTIVE_ARCH=NO
            IPHONEOS_DEPLOYMENT_TARGET=15.4
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="PREPAID_VERSION"
            SYMROOT="$BUILD_ROOT"
            BUILD_DIR="$BUILD_ROOT"
          )
          # 1) shared lib
          xcodebuild -project KeePassiumLib/KeePassiumLib.xcodeproj -target KeePassiumLib "${COMMON[@]}" build 2>&1 | tee build.log
          # 2) Pro AutoFill first (ensures appex exists even if embed race)
          xcodebuild -project KeePassium.xcodeproj -target "KeePassium Pro AutoFill" "${COMMON[@]}" FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" build 2>&1 | tee -a build.log
          # 3) Pro app (embeds AutoFill)
          xcodebuild -project KeePassium.xcodeproj -target "KeePassium Pro" "${COMMON[@]}" FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" ASSETCATALOG_COMPILER_APPICON_NAME=app-icon-pro ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO build 2>&1 | tee -a build.log

      - name: Sign and package IPA
        run: |
          set -e
          APP_PATH="$(find "$PWD/build" -type d -name 'KeePassium Pro.app' | head -n 1)"
          test -n "$APP_PATH"
          echo "App=$APP_PATH"
          APPEX_PATH="$APP_PATH/PlugIns/KeePassium Pro AutoFill.appex"
          test -d "$APPEX_PATH"
          echo "Appex=$APPEX_PATH"

          # Official-mirrored entitlements (team 84W4PHXS24 -> TROLL), Pro IDs, no iCloud.
          echo '' | base64 -D > app.entitlements
          echo '' | base64 -D > appex.entitlements

          echo '--- app.entitlements ---'
          cat app.entitlements
          echo '--- appex.entitlements ---'
          cat appex.entitlements

          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          APPEX_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX_PATH/Info.plist")
          APPEX_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX_PATH/Info.plist")
          APP_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")
          APPEX_MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APPEX_PATH/Info.plist" 2>/dev/null || echo unknown)
          echo "APP_ID=$APP_ID"
          echo "APPEX_ID=$APPEX_ID"
          echo "APPEX_POINT=$APPEX_POINT"
          echo "APP_VER=$APP_VER APP_BUILD=$APP_BUILD MIN_OS=$MIN_OS APPEX_MIN_OS=$APPEX_MIN_OS"

          # Hard reject wrong branch / wrong MinOS (crash on iOS 16 was exactly this)
          test "$APP_ID" = "com.keepassium.ios.pro"
          test "$APPEX_ID" = "com.keepassium.ios.pro.KeePassium-AutoFill"
          test "$APP_VER" = "1.53"
          test "$APP_BUILD" = "154"
          test "$MIN_OS" = "15.4"
          if [ "$APPEX_MIN_OS" != "unknown" ]; then test "$APPEX_MIN_OS" = "15.4"; fi
          # Must be credential provider extension
          echo "$APPEX_POINT" | grep -q 'authentication-services-credential-provider-ui'

          printf 'APPL????' > "$APP_PATH/PkgInfo"
          rm -rf "$APP_PATH/SC_Info" "$APP_PATH/PlugIns/"*/SC_Info "$APP_PATH/Frameworks/"*/SC_Info || true

          # Official IPA embeds SPM resource bundles in BOTH app and AutoFill:
          #   DomainParser_DomainParser.bundle  (public_suffix_list.dat)  <-- crash without this
          #   TPInAppReceipt_TPInAppReceipt.bundle
          #   Zxcvbn_Zxcvbn.bundle
          # Building with -target often skips copying these; embed manually.
          echo '--- locate SPM resource bundles ---'
          find "$PWD/build" "$PWD/SourcePackages" -type d \( -name 'DomainParser_DomainParser.bundle' -o -name 'TPInAppReceipt_TPInAppReceipt.bundle' -o -name 'Zxcvbn_Zxcvbn.bundle' \) 2>/dev/null | sort -u | tee /tmp/spm_bundles.txt || true
          ls -la "$APP_PATH"/*.bundle 2>/dev/null || true
          ls -la "$APPEX_PATH"/*.bundle 2>/dev/null || true

          embed_bundle() {
            local name="$1"
            local dest_app="$APP_PATH/$name"
            local dest_appex="$APPEX_PATH/$name"
            local src
            src="$(find "$PWD/build" "$PWD/SourcePackages" -type d -name "$name" 2>/dev/null | head -n 1 || true)"
            if [ -z "$src" ]; then
              # sometimes products land next to the app under Release-iphoneos
              src="$(find "$PWD/build" -type d -name "$name" 2>/dev/null | head -n 1 || true)"
            fi
            if [ -z "$src" ]; then
              echo "MISSING bundle: $name"
              return 1
            fi
            echo "Embed $name from $src"
            rm -rf "$dest_app" "$dest_appex"
            cp -R "$src" "$dest_app"
            cp -R "$src" "$dest_appex"
            # resource bundles should be signed as bundles (ad-hoc)
            codesign --force --sign - --timestamp=none "$dest_app" || true
            codesign --force --sign - --timestamp=none "$dest_appex" || true
          }

          embed_bundle "DomainParser_DomainParser.bundle"
          embed_bundle "TPInAppReceipt_TPInAppReceipt.bundle" || echo "WARN: TPInAppReceipt bundle missing (non-fatal for AutoFill search)"
          embed_bundle "Zxcvbn_Zxcvbn.bundle" || echo "WARN: Zxcvbn bundle missing"

          echo '--- bundles after embed ---'
          ls -la "$APP_PATH"/*.bundle
          ls -la "$APPEX_PATH"/*.bundle
          test -d "$APP_PATH/DomainParser_DomainParser.bundle"
          test -d "$APPEX_PATH/DomainParser_DomainParser.bundle"
          # must contain public suffix list used by DomainParser
          find "$APPEX_PATH/DomainParser_DomainParser.bundle" -type f | head -n 20
          test -n "$(find "$APPEX_PATH/DomainParser_DomainParser.bundle" -name 'public_suffix_list.dat' | head -n 1)"

          # IMPORTANT: do NOT put app entitlements on frameworks.
          # Wrong app-id on KeePassiumLib.framework can make AutoFill fail to load.
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -name '*.framework' -maxdepth 1 -print0 | while IFS= read -r -d '' fw; do
              echo "Sign framework (no entitlements): $fw"
              codesign --force --sign - --timestamp=none "$fw"
            done
          fi

          echo "Sign appex with autofill entitlements"
          codesign --force --sign - --entitlements appex.entitlements --timestamp=none "$APPEX_PATH"

          echo "Sign app"
          codesign --force --sign - --entitlements app.entitlements --timestamp=none "$APP_PATH"

          echo '--- signed app entitlements ---'
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | head -n 120 || true
          echo '--- signed appex entitlements ---'
          codesign -d --entitlements :- "$APPEX_PATH" 2>/dev/null | head -n 120 || true
          echo '--- framework entitlements (should be empty/minimal) ---'
          codesign -d --entitlements :- "$APP_PATH/Frameworks/KeePassiumLib.framework" 2>/dev/null | head -n 40 || true

          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | grep -q 'autofill-credential-provider'
          codesign -d --entitlements :- "$APPEX_PATH" 2>/dev/null | grep -q 'autofill-credential-provider'
          codesign -d --entitlements :- "$APPEX_PATH" 2>/dev/null | grep -q 'group.com.keepassium'
          codesign -d --entitlements :- "$APPEX_PATH" 2>/dev/null | grep -q 'TROLL.com.keepassium.SharedItems'

          echo '--- structure ---'
          ls -la "$APP_PATH/PlugIns"
          ls -la "$APP_PATH/Frameworks"
          test -d "$APP_PATH/_CodeSignature"
          test -d "$APPEX_PATH/_CodeSignature"
          test -d "$APP_PATH/Frameworks/KeePassiumLib.framework"

          # deep verify (ad-hoc may warn; still useful)
          codesign --verify --deep --verbose=2 "$APP_PATH" 2>&1 | tail -n 30 || true

          rm -rf ipa_stage
          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/
          rm -f KeePassium-Pro-1.53.154.ipa
          (cd ipa_stage && zip -qry ../KeePassium-Pro-1.53.154.ipa Payload)
          ls -lh KeePassium-Pro-1.53.154.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-1.53.154-IPA
          path: KeePassium-Pro-1.53.154.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
