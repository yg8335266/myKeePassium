name: Build KeePassium Pro 153

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: keepassium/KeePassium
          ref: 1.53.154
          fetch-depth: 0

      - name: Verify version
        run: git describe --tags --exact-match HEAD

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app && xcodebuild -version

      - name: Create license placeholder
        run: mkdir -p KeePassiumLib/KeePassiumLib/resources/licensing && python3 -c "open('KeePassiumLib/KeePassiumLib/resources/licensing/v1-proofs.sha256','wb').close()"

      - name: Fix TPInAppReceipt pin
        run: |
          OLD=6630e3858f0d0a5803cede6f82afeaed5f5de7b6
          NEW=2f8a1cae6b578423d9941b89a0f07c6cce1e1c22
          find . -name Package.resolved -exec sed -i '' "s/$OLD/$NEW/g" {} +
          if grep -R "$OLD" . --include='Package.resolved' >/dev/null 2>&1; then find . -name Package.resolved -delete; fi
          find . -name Package.resolved -print || true

      - name: Patch for TrollStore persistence
        run: |
          echo '' | base64 -D > /tmp/patch_kp.py
          python3 /tmp/patch_kp.py
          grep -n "unexpected format, removing\|TROLL.com.keepassium.SharedItems\|creating without wiping keychain" KeePassiumLib/KeePassiumLib/util/Keychain.swift
          grep -n "falling back to standard\|containerURL" KeePassiumLib/KeePassiumLib/util/UserDefaults+appGroupShared.swift

      - name: Resolve packages
        run: |
          mkdir -p SourcePackages
          xcodebuild -resolvePackageDependencies -project KeePassiumLib/KeePassiumLib.xcodeproj -clonedSourcePackagesDirPath "$PWD/SourcePackages"
          xcodebuild -resolvePackageDependencies -project KeePassium.xcodeproj -clonedSourcePackagesDirPath "$PWD/SourcePackages"

      - name: Link YubiKit if present
        run: |
          if [ -d SourcePackages/checkouts/yubikit-ios/YubiKit ]; then ln -sfn "$PWD/SourcePackages/checkouts/yubikit-ios/YubiKit" "$PWD/../YubiKit"; fi

      - name: Build
        run: |
          set -e
          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"
          xcodebuild -project KeePassiumLib/KeePassiumLib.xcodeproj -target KeePassiumLib -configuration Release -sdk iphoneos -clonedSourcePackagesDirPath "$PWD/SourcePackages" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= ONLY_ACTIVE_ARCH=NO SYMROOT="$BUILD_ROOT" BUILD_DIR="$BUILD_ROOT" build 2>&1 | tee build.log
          xcodebuild -project KeePassium.xcodeproj -target "KeePassium Pro" -configuration Release -sdk iphoneos -clonedSourcePackagesDirPath "$PWD/SourcePackages" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= ONLY_ACTIVE_ARCH=NO SYMROOT="$BUILD_ROOT" BUILD_DIR="$BUILD_ROOT" FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" ASSETCATALOG_COMPILER_APPICON_NAME=app-icon-pro ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO build 2>&1 | tee -a build.log

      - name: Sign and package IPA
        run: |
          set -e
          APP_PATH="$(find "$PWD/build" -type d -name 'KeePassium Pro.app' | head -n 1)"
          test -n "$APP_PATH"
          echo "App=$APP_PATH"
          # App ID: com.keepassium.ios.pro
          # Appex ID: com.keepassium.ios.pro.KeePassium-AutoFill
          # keychain group MUST match Keychain.accessGroup patch
          echo '' | base64 -D > app.entitlements
          echo '' | base64 -D > appex.entitlements
          echo '--- app.entitlements ---'
          cat app.entitlements
          echo '--- appex.entitlements ---'
          cat appex.entitlements
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/PlugIns/KeePassium Pro AutoFill.appex/Info.plist" || true
          if [ -d "$APP_PATH/Frameworks" ]; then find "$APP_PATH/Frameworks" -name '*.framework' -maxdepth 1 -exec codesign --force --sign - --entitlements app.entitlements --timestamp=none {} \;; fi
          if [ -d "$APP_PATH/PlugIns" ]; then find "$APP_PATH/PlugIns" -name '*.appex' -maxdepth 1 -exec codesign --force --sign - --entitlements appex.entitlements --timestamp=none {} \;; fi
          codesign --force --sign - --entitlements app.entitlements --timestamp=none "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" | head -n 80 || true
          codesign -d --entitlements :- "$APP_PATH/PlugIns/KeePassium Pro AutoFill.appex" | head -n 80 || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" || true
          ls -la "$APP_PATH/_CodeSignature"
          ls -la "$APP_PATH/PlugIns/KeePassium Pro AutoFill.appex/_CodeSignature" || true
          rm -rf ipa_stage
          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/
          rm -f KeePassium-Pro-1.53.154.ipa
          (cd ipa_stage && zip -qry ../KeePassium-Pro-1.53.154.ipa Payload)
          ls -lh KeePassium-Pro-1.53.154.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-1.53.154-IPA
          path: KeePassium-Pro-1.53.154.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
