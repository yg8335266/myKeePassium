name: Build KeePassium Pro 153

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: keepassium/KeePassium
          ref: 1.53.154
          fetch-depth: 0

      - name: Verify version
        run: git describe --tags --exact-match HEAD

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Create license placeholder
        run: |
          mkdir -p KeePassiumLib/KeePassiumLib/resources/licensing
          python3 -c "open('KeePassiumLib/KeePassiumLib/resources/licensing/256','wb').close()"
          ls -la KeePassiumLib/KeePassiumLib/resources/licensing

      # ★ 关键：先修坏掉的 Package.resolved pin
      - name: Fix TPInAppReceipt pin
        run: |
          set -e
          echo "Before:"
          find . -name Package.resolved -print || true

          # 旧坏 commit -> 当前 keepassium 分支 tip
          OLD=6630e3858f0d0a5803cede6f82afeaed5f5de7b6
          NEW=2f8a1cae6b578423d9941b89a0f07c6cce1e1c22

          find . -name Package.resolved -print0 | while IFS= read -r -d '' f; do
            echo "Patching $f"
            sed -i '' "s/${OLD}/${NEW}/g" "$f"
          done

          # 如果还残留坏 pin，直接删 resolved，让 SPM 按 branch 重解析
          if grep -R "$OLD" . --include='Package.resolved' >/dev/null 2>&1; then
            echo "Bad pin still present, deleting Package.resolved"
            find . -name Package.resolved -delete
          fi

          echo "After:"
          find . -name Package.resolved -print || true
          grep -R "tpinappreceipt\|TPInAppReceipt\|6630e38\|2f8a1ca" . --include='Package.resolved' || true

      - name: Resolve packages
        run: |
          set -e
          mkdir -p SourcePackages
          xcodebuild -resolvePackageDependencies \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"
          xcodebuild -resolvePackageDependencies \
            -project Kee \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"
          ls -la SourcePackages Link YubiKit if present
        run: |
          if [ -d SourcePackages/checkouts/yubikit-ios/YubiKit ]; then
            ln -sfn "$PWD/SourcePackages/checkouts/yubikit-ios/YubiKit" "$PWD/../YubiKit"
            echo "YubiKit linked"
          else
            echo "YubiKit not found, skip"
          fi

      - name: Build
        run: |
          set -e
          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"

          xcodebuild \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -target KeePassiumLib \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$BUILD_ROOT" \
            BUILD_DIR="$BUILD_ROOT" \
            build 2>&1 | tee build.log

          xcodebuild \
            -project KeePassium.xcodeproj \
            -target "KeePassium Pro" \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$BUILD_ROOT" \
            BUILD_DIR="$BUILD_ROOT" \
            FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" \
            ASSETCATALOG_COMPILER_APPICON_NAME=app-icon-pro \
            ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS=NO \
            build 2>&1 | tee -a build.log

      - name: Sign and package IPA
        run: |
          set -e
          APP_PATH="$(find "$PWD/build" -type d -name 'KeePassium Pro.app' | head -n 1)"
          test -n "$APP_PATH"
          echo "App=$APP_PATH"

          python3 - <<'PY'
          from pathlib import Path
          Path("app.entitlements").write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.keepassium.ios.pro</string>
            <key>com.apple.developer.team-identifier</key>
            <string>TROLL</string>
            <key>com.apple.developer.authentication-services.autofill-credential-provider</key>
            <true/>
            <key>com.apple.developer.default-data-protection</key>
            <string>NSFileProtectionComplete</string>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.keepassium</string>
            </array>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
              <string>com.keepassium.SharedItems</string>
            </array>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
          </dict>
          </plist>
          """, encoding="utf-8")
          Path("appex.entitlements").write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.keepassium.ios.pro.KeePassium-AutoFill</string>
            <key>com.apple.developer.team-identifier</key>
            <string>TROLL</string>
            <key>com.apple.developer.authentication-services.autofill-credential-provider</key>
            <true/>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.com.keepassium</string>
            </array>
            <key>keychain-access-groups</key>
            <array>
              <string>*</string>
              <string>com.keepassium.SharedItems</string>
            </array>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
          codesign --force --sign - --entitlements app.entitlements --timestamp=none "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" | head -n 50 || true
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist" || true
          ls -la "$APP_PATH/_CodeSignature" || true

          rm -rf ipa_stage
          mkdir -p ipa_stage/Payload
          cp -R "$APP_PATH" ipa_stage/Payload/
          rm -f KeePassium-Pro-1.53.154.ipa
          (cd ipa_stage && zip -qry ../KeePassium-Pro-1.53.154.ipa Payload)
          ls -lh KeePassium-Pro-1.53.154.ipa
          unzip -l KeePassium-Pro-1.53.154.ipa | head -n 80

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-1.53.154-IPA
          path: uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
