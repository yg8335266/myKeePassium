      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project KeePassium.xcodeproj

      - name: Create Pro scheme
        run: |
          set -euo pipefail
          mkdir -p "KeePassium.xcodeproj/xcshareddata/xcschemes"
          cat > "KeePassium.xcodeproj/xcshareddata/xcschemes/KeePassium Pro.xcscheme" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion = "1640" version = "1.7">
             <BuildAction parallelizeBuildables = "YES" buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting = "YES" buildForRunning = "YES" buildForProfiling = "YES" buildForArchiving = "YES" buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "REPLACE_PRO_ID"
                         BuildableName = "KeePassium Pro.app"
                         BlueprintName = "KeePassium Pro"
                         ReferencedContainer = "container:KeePassium.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <LaunchAction buildConfiguration = "Release" selectedDebuggerIdentifier = "" selectedLauncherIdentifier = "Xcode.IDEFoundation.Launcher.PosixSpawn" launchStyle = "0" useCustomWorkingDirectory = "NO" ignoresPersistentStateOnLaunch = "NO" debugDocumentVersioning = "YES" debugServiceExtension = "internal" allowLocationSimulation = "YES">
                <BuildableProductRunnable runnableDebuggingMode = "0">
                   <BuildableReference
                      BuildableIdentifier = "primary"
                      BlueprintIdentifier = "REPLACE_PRO_ID"
                      BuildableName = "KeePassium Pro.app"
                      BlueprintName = "KeePassium Pro"
                      ReferencedContainer = "container:KeePassium.xcodeproj">
                   </BuildableReference>
                </BuildableProductRunnable>
             </LaunchAction>
          </Scheme>
          EOF

          PRO_ID="$(
            python3 - <<'PY'
          import re
          t=open("KeePassium.xcodeproj/project.pbxproj",encoding="utf-8",errors="ignore").read()
          m=re.search(r'([A-F0-9]{24})\s*/\*\s*KeePassium Pro\s*\*/\s*=\s*\{\s*isa = PBXNativeTarget;', t)
-F0-9]{24})\s*/\*\s*KeePassium Pro\s*\*/\s*=\s*\{[^}]*?isa = PBXNativeTarget;', t, re.S)
          if not m:
              raise SystemExit("cannot find KeePassium Pro target id")
          print(m.group(1))
          PY
          )"
          echo "Pro target id: $PRO_ID"
          sed -i '' "s/REPLACE_PRO_ID/${PRO_ID}/g" "KeePassium.xcodeproj/xcshareddata/xcschemes/KeePassium Pro.xcscheme"

      - name: Build KeePassium Pro
        run: |
          set -euo pipefail
          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"

          set +e
          xcodebuild \
            -project KeePassium.xcodeproj \
            -scheme "KeePassium Pro" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_ROOT" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "===== FIRST ERRORS ====="
          grep -E 'error:|fatal error:|❌' build.log | head -n 80 || true
          echo "===== LAST 80 LINES ====="
          tail -n 80 build.log || true

          exit $STATUS

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
