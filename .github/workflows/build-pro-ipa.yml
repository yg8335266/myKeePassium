name: Build KeePassium Pro IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #1 规避 format 76
      - name: Select Xcode 16.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      # #4 规避 TPInAppReceipt 坏 pin
      - name: Fix Swift package pins
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            echo "Patching $f"
            sed -i '' 's/6630e3858f0d0a5803cede6f82afeaed5f5de7b6/2f8a1cae6b578423d9941b89a0f07c6cce1e1c22/g' "$f" || true
          done < <(find . -name Package.resolved -print)

          if grep -R "6630e3858f0d0a5803cede6f82afeaed5f5de7b6" . --include='Package.resolved' >/dev/null 2>&1; then
            echo "Bad pin still present, removing Package.resolved"
            find . -name Package.resolved -delete
          fi

      - name: List projects
        run: |
          set -euo pipefail
          xcodebuild -project KeePassiumLib/KeePassiumLib.xcodeproj -list
          xcodebuild -project KeePassium.xcodeproj -list

      # 固定 SPM 路径，便于后面给 YubiKit 做链接
      - name: Resolve packages
        run: |
          set -euo pipefail
          rm -rf SourcePackages
          mkdir -p SourcePackages

          xcodebuild -resolvePackageDependencies \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"

          xcodebuild -resolvePackageDependencies \
            -project KeePassium.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"

          echo "SPM checkouts:"
          ls -la SourcePackages/checkouts || true

      # #5 规避 YubiKit 头文件：满足工程里的 ../YubiKit/**
      - name: Link YubiKit headers path
        run: |
          set -euo pipefail

          YUBI_CHECKOUT=""
          if [ -d "$PWD/SourcePackages/checkouts/yubikit-ios" ]; then
            YUBI_CHECKOUT="$PWD/SourcePackages/checkouts/yubikit-ios"
          else
            YUBI_CHECKOUT="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/checkouts/yubikit-ios' 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$YUBI_CHECKOUT" ] || [ ! -d "$YUBI_CHECKOUT/YubiKit" ]; then
            echo "ERROR: yubikit-ios checkout not found"
            find SourcePackages -maxdepth 4 -type d -print || true
            exit 1
          fi

          echo "YubiKit checkout: $YUBI_CHECKOUT"
          ls -la "$YUBI_CHECKOUT/YubiKit"

          # 工程 HEADER_SEARCH_PATHS = "../YubiKit/**"
          # PROJECT_DIR = 仓库根目录，所以要在仓库的上一级放 YubiKit
          ln -sfn "$YUBI_CHECKOUT/YubiKit" "$PWD/../YubiKit"
          ls -la "$PWD/../YubiKit"
          # 抽查关键头文件
          ls -la "$PWD/../YubiKit/YubiKit/Helpers/Additions/UIDeviceAdditions.h"
          ls -la "$PWD/../YubiKit/YubiKit/Connections/Shared/Services/NFC/YKFNFCSession.h" \
            || ls -la "$PWD/../YubiKit/YubiKit/Connections" || true

      # #2 #3：SYMROOT；先 Lib 后 Pro
      # 注意：绝不能全局覆盖 HEADER_SEARCH_PATHS
      - name: Build KeePassiumLib then KeePassium Pro
        run: |
          set -euo pipefail

          BUILD_ROOT="$PWD/build"
          rm -rf "$BUILD_ROOT" build.log
          mkdir -p "$BUILD_ROOT"

          COMMON=(
            -configuration Release
            -sdk iphoneos
            -clonedSourcePackagesDirPath "$PWD/SourcePackages"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ONLY_ACTIVE_ARCH=NO
            SYMROOT="$BUILD_ROOT"
            BUILD_DIR="$BUILD_ROOT"
          )

          dump_errors() {
            echo "===== FIRST ERRORS ====="
            grep -E 'error:|fatal error:' build.log | head -n 120 || true
            echo "===== LAST 120 LINES ====="
            tail -n 120 build.log || true
          }

          set +e

          echo "===== 1) Build KeePassiumLib ====="
          xcodebuild \
            -project KeePassiumLib/KeePassiumLib.xcodeproj \
            -target KeePassiumLib \
            "${COMMON[@]}" \
            build 2>&1 | tee -a build.log
          STATUS1=${PIPESTATUS[0]}
          if [ "$STATUS1" -ne 0 ]; then
            dump_errors
            exit "$STATUS1"
          fi

          echo "===== 2) Build KeePassium Pro ====="
          # 只补 framework 搜索路径，不覆盖 HEADER_SEARCH_PATHS
          xcodebuild \
            -project KeePassium.xcodeproj \
            -target "KeePassium Pro" \
            "${COMMON[@]}" \
            FRAMEWORK_SEARCH_PATHS="$BUILD_ROOT/Release-iphoneos $BUILD_ROOT/Release-iphoneos/**" \
            build 2>&1 | tee -a build.log
          STATUS2=${PIPESTATUS[0]}
          set -e

          dump_errors
          echo "===== ARTIFACT SEARCH ====="
          find "$BUILD_ROOT" -name 'KeePassiumLib.framework' -type d -print || true
          find "$BUILD_ROOT" -name 'KeePassium Pro.app' -type d -print || true
          find "$BUILD_ROOT" -name '*.appex' -print || true

          exit "$STATUS2"

      - name: Package IPA
        if: success()
        run: |
          set -euo pipefail
          APP_PATH="$(find "$PWD/build" -type d -name 'KeePassium Pro.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: KeePassium Pro.app not found"
            find "$PWD/build" -maxdepth 8 -type d -print || true
            exit 1
          fi

          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          ls -la "$APP_PATH/PlugIns" || true
          ls -la "$APP_PATH/Frameworks" || true

          STAGE="$PWD/ipa_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"

          OUT="$PWD/KeePassium-Pro.ipa"
          rm -f "$OUT"
          (cd "$STAGE" && zip -qry "$OUT" Payload)
          ls -lh "$OUT"
          unzip -l "$OUT" | head -n 120

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-Pro-IPA
          path: KeePassium-Pro.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
